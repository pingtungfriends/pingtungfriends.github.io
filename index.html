<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>品牌列表｜示範</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="index">
  <section class="hero-showcase">
    <div class="nav">
      <div class="brand">Pingtung Friends</div>
      <nav>
        <a href="#" class="active">首頁</a>
        <a href="#">品牌</a>
        <a href="#">產品</a>
        <a href="#">服務</a>
        <a href="#">聯絡</a>
      </nav>
      <div class="burger" aria-label="menu"><span></span><span></span><span></span></div>
    </div>
    <div class="hero-shell">
      <div>
        <p class="kicker">屏東在地 · 海風與田野</p>
        <h1 class="hero-brand">品牌名稱</h1>
        <p class="hero-tagline">品牌標語</p>
        <p class="lede hero-story">品牌故事簡述</p>
        <a class="ghost-btn hero-cta" href="#" target="_blank" rel="noopener">立即品嚐</a>
      </div>
      <div>
        <div class="glass-panel">
          <div class="hero-big-text"></div>
        </div>
        <div class="hero-pager">01 <span>/</span> 02</div>
      </div>
    </div>
    <div class="hero-social">
      <a href="#" aria-label="facebook">f</a>
      <a href="#" aria-label="twitter">t</a>
      <a href="#" aria-label="instagram">ig</a>
    </div>
  </section>
  <div class="container">
    <header>
      <div class="logo">Pingtung Friends</div>
      <a class="btn-primary" href="https://line.me">聯繫我們</a>
    </header>

    <section class="section">
      <h2>品牌一頁式示範</h2>
      <p class="small">點擊品牌卡片查看一頁式頁面（brand.html?slug=...）。</p>
      <div class="brand-list"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
