<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>品牌頁｜示範</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="brand">
  <div class="page-bg"></div>
  <div class="page-shell">
    <header class="lp-nav">
      <div class="logo">
        <img id="brand-logo" src="" alt="" style="display:none; height: 32px; width: auto; object-fit: contain;">
        <span id="brand-name-text">屏東平原</span>
      </div>
      <a class="btn-primary" href="index.html">返回列表</a>
    </header>

    <section class="lp-hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-content">
        <div class="hero-badges"></div>
        <h1 class="hero-brand"></h1>
        <p class="hero-tagline"></p>
        <p class="hero-story"></p>
      </div>
      <div class="hero-glass">
        <div class="hero-big-text"></div>
      </div>
    </section>

    <section id="story" class="lp-section story-section">
      <div class="section-head">
        <h2>品牌故事</h2>
        <p class="small">在地風土 · 共好加工 · 自然風味</p>
      </div>
      <div class="story-grid">
        <p class="story-text"></p>
        <div class="story-card">
          <img class="story-img" alt="story" />
          <div class="story-note">產地風景 / 品牌日常</div>
        </div>
      </div>
    </section>

    <section id="products" class="lp-section recipes-section">
      <div class="section-head">
        <h2>推薦產品</h2>
      </div>
      <div class="product-grid"></div>
    </section>

    <section id="videos" class="lp-section">
      <div class="section-head">
        <h2>影音紀實</h2>
      </div>
      <div class="video-list"></div>
    </section>

    <section id="faq" class="lp-section">
      <div class="section-head">
        <h2>常見問題</h2>
      </div>
      <div class="faq-list" id="faq-list"></div>
    </section>
  </div>
  <a id="footer-cta" class="footer-cta" href="#">立刻行動</a>
  <script src="app.js"></script>
</body>

</html>
