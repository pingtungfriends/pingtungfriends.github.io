<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海浪風格 Hero 示範</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hero-concept.css" />
</head>
<body>
  <div class="stage">
    <header class="nav">
      <div class="brand">Pingtung Friends</div>
      <nav>
        <a href="#" class="active">首頁</a>
        <a href="#">品牌</a>
        <a href="#">產品</a>
        <a href="#">服務</a>
        <a href="#">聯絡</a>
      </nav>
      <div class="burger" aria-label="menu">
        <span></span><span></span><span></span>
      </div>
    </header>
    <div class="hero">
      <div class="hero-left">
        <p class="kicker">屏東在地 · 農產與海風的節奏</p>
        <h1>自然流動的風味</h1>
        <p class="lede">低溫烘焙、保留原味，與在地小農共創；就像浪潮一樣，帶來綿延的香氣。</p>
        <a class="ghost-btn" href="#">立即品嚐</a>
      </div>
      <div class="hero-right">
        <div class="big-text" aria-hidden="true">
          <span>FLOW</span>
          <span>WITH</span>
          <span>IT</span>
        </div>
        <div class="pager">01 <span>/</span> 03</div>
      </div>
      <div class="social">
        <a href="#" aria-label="facebook">f</a>
        <a href="#" aria-label="twitter">t</a>
        <a href="#" aria-label="instagram">ig</a>
      </div>
    </div>
  </div>

</html>
